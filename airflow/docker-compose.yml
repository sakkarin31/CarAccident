version: "3"

# ------------------------------------------------------
# 🧱 Common configuration for all Airflow services
# ------------------------------------------------------
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: custom-airflow:latest
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=aXxFKh5r1IZ0u-Vi5vjD8a1j7_F-GlTwCtIuHk06qBQ=
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__API__AUTH_BACKEND=airflow.api.auth.backend.basic_auth
    - AIRFLOW_CONN_POSTGRES_DEFAULT=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW__WEBSERVER__SECRET_KEY=please-change-me-32bytes
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
    - ./requirements.txt:/requirements.txt
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    - postgres

# ------------------------------------------------------
# 🚀 Services
# ------------------------------------------------------
services:
  # 🗄️ Database
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # 🧰 Initialize Airflow (run only once)
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --password admin --firstname admin --lastname user --role Admin --email admin@example.com"
    restart: "no"

  # 🌐 Airflow Web UI
  webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always

  # ⏱️ Scheduler
  scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  # 🚦 Streamlit App
  streamlit:
    build:
      context: ../app                # 🔹 ชี้ไปยังโฟลเดอร์ที่มี app_songkla.py
    container_name: streamlit_app
    ports:
      - "8501:8501"                  # 🔹 เปิดเว็บที่ http://localhost:8501
    volumes:
      - ../app:/app                  # 🔹 sync โค้ดในเครื่องเข้าคอนเทนเนอร์
    depends_on:
      - postgres

# ------------------------------------------------------
# 💾 Volume สำหรับเก็บข้อมูลถาวร
# ------------------------------------------------------
volumes:
  postgres-db-volume:
